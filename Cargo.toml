[package]
name = "sys_resolver"
version = "0.1.0"
edition = "2024"
description = "Dynamic FHS-path resolution logic for ZainiumOS"
license = "GPL-3.0-only"

[lib]
name = "sys_resolver"

crate-type = ["lib", "staticlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "sys-resolver"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
